# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "CN"
site_theme               : "default"
title                    : "王晓泳"
title_separator          : "-"
name                     : &name "王晓泳"
description              : &description "来自河北省石家庄市灵寿县，毕业于燕山大学机械工程学院，现就读于河北工业大学"
url                      : https://academicpages.github.io   # 请改成您自己的 GitHub Pages 地址
baseurl                  : ""
repository               : "academicpages/academicpages.github.io"   # 请改成您自己的仓库名

# Site Author - 这里放您的自我介绍（侧边栏或个人资料卡）
author:
  avatar           : "profile.png"
  name             : "王晓泳"
  pronouns         : 
  bio              : "来自河北省石家庄市灵寿县，毕业于燕山大学机械工程学院，现就读于河北工业大学"
  location         : "河北工业大学"
  employer         : 
  uri              : 
  email            : "您的邮箱（可选）"

  # 学术链接（如果不需要可以留空或删除整行）
  googlescholar    : 
  orcid            : 
  github           : "XiaoyongWang"   # 改成您的 GitHub 用户名
  # 其他社交账号全部留空或删除

# 禁用论文集、会议等分类（原来有 books, manuscripts, conferences 的部分）
# 直接把整个 publication_category 删掉或注释掉，这里注释掉：
# publication_category:
#   books:
#     title: 'Books'
#   manuscripts:
#     title: 'Journal Articles'    
#   conferences:
#     title: 'Conference Papers'

# Site Settings
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false

# SEO Related (可保持空)
google_site_verification :
bing_site_verification   :

# Analytics (关闭)
analytics:
  provider               : "false"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# 禁用所有额外的集合（publications, talks, teaching, portfolio）
# 只保留最基本的 _pages
collections:
  # teaching:
  #   output: true
  #   permalink: /:collection/:path/
  # publications:
  #   output: true
  #   permalink: /:collection/:path/
  # portfolio:
  #   output: true
  #   permalink: /:collection/:path/
  # talks:
  #   output: true
  #   permalink: /:collection/:path/

# 默认布局：只给 pages 保留，不要 posts 和其他
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives (保持默认)
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
